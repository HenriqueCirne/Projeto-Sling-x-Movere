schema: 1
story: '1.5'
story_title: 'Painel (Dashboard geral) com KPIs de resumo'
gate: CONCERNS
status_reason: 'AC1, AC2 e AC3 implementadas e verificadas por teste/validação manual. AC4 está genuinamente bloqueada pela Story 1.4 (permissão da API Moveres) — não é falha de implementação. Um risco real (SQL cru não testável) foi encontrado e corrigido nesta revisão. Nenhum problema bloqueante de segurança.'
reviewer: 'Quinn (Test Architect)'
reviewed_revision: 'commit:ea740bb'
updated: '2026-08-31T17:15:00Z'

top_issues:
  - id: 'REQ-001'
    severity: medium
    finding: 'AC4 ("Dados exibidos vêm da tabela sincronizada") não está atendida — a Story 1.4 permanece bloqueada por uma questão de permissão na conta da API Moveres (ver `docs/architecture/api-moveres-contract-spike.md`), então `sales_entries` está vazia e os KPIs mostram zeros. A query está correta e não vai precisar de nenhuma mudança quando a 1.4 desbloquear, mas a story fecha com uma AC não cumprida.'
    suggested_action: 'Revisitar esta story (ou apenas confirmar via smoke test manual) assim que a Story 1.4 gravar dados reais em `sales_entries`.'

  - id: 'TEST-001'
    severity: medium
    finding: 'Mesma limitação recorrente das Stories 1.1–1.3: sem Docker/WSL nesta máquina, não há Postgres real para exercitar as queries de agregação, o filtro de período e o fluxo E2E completo (login → Painel → filtro) contra dado de verdade. Cobertura é forte no nível de lógica pura (repositório fake, 19 testes novos) mas a integração real com Postgres nunca rodou.'
    suggested_action: 'Em qualquer máquina com Docker: seed de alguns registros em `sales_entries`, abrir `/dashboard` autenticado, e conferir visualmente que os 5 KPIs e o filtro de período respondem corretamente.'

  - id: 'ARCH-001'
    severity: low
    finding: 'A página do Painel não tem tratamento de erro para falha de conexão com o banco — diferente do health-check da Story 1.1, que degrada (`status: degraded`) em vez de derrubar. Uma falha de `DATABASE_URL`/Postgres indisponível aqui produziria a página de erro genérica do Next.js. Nenhuma AC ou Dev Note desta story pede resiliência a esse cenário, então não é um item cobrado — só uma observação para quando a Epic 2/3 repetir este padrão de página.'
    suggested_action: 'Considerar um `error.tsx` para o grupo `(protected)` quando mais páginas dependentes de banco existirem (Epic 2/3), em vez de tratar caso a caso.'

  - id: 'TEST-002'
    severity: low
    finding: 'Sem teste de render para `KpiCard`/`PeriodFilterForm`/a página do Painel — mesma lacuna pré-existente já registrada como TEST-002 nos gates das Stories 1.1/1.2 (ambiente Vitest é `node`, sem Testing Library/jsdom). Não é regressão desta story.'
    suggested_action: 'Mesma recomendação já registrada nas stories anteriores: quando jsdom + Testing Library forem adicionados, incluir os testes de render pendentes acumulados (health-check da 1.1, LoginForm da 1.2, e agora o Painel).'

waiver: { active: false }

