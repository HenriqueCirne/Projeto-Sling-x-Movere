    - file: 'packages/web/src/features/auth/auth.config.ts (revisado, não alterado pelo QA)'
      change: 'Bugfix do @dev revisado e confirmado: trustHost estava ausente desde a Story 1.2, causando UntrustedHost em toda requisição fora da Vercel'
      why: 'Confirmado por teste de regressão (shouldTrustHost) e por validação manual (dev server sem o erro após o fix)'
