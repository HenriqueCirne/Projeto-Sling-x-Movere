schema: 1
story: '2.4'
story_title: 'Vendas por Faixa de Prazo Médio'
gate: CONCERNS
status_reason: 'AC1 e AC2 implementadas e verificadas (13 testes novos + validação manual contra o banco real: as 7 faixas somam exatamente o faturamento total já validado, R$ 10.394.644,52). Um bug de fronteira real (buraco entre faixas para prazo médio fracionário) foi encontrado e corrigido durante o desenvolvimento, com teste de regressão. Nenhum problema bloqueante.'
reviewer: 'Quinn (Test Architect)'
reviewed_revision: 'commit:84efa14'
updated: '2026-09-03T00:00:00Z'

top_issues:
  - id: 'REQ-001'
    severity: low
    finding: 'Os limites das faixas (P4–P9, P1) vieram de uma decisão verbal do gestor nesta sessão, sem um export/planilha/documento formal para citar como fonte — diferente de todos os outros achados de negócio do projeto (TD-04, etc.), que sempre citam um arquivo real. Isso não é uma falha: a Story 2.4 existia justamente porque essa regra nunca esteve documentada em lugar nenhum (R5), e o Artigo IV (No Invention) foi respeitado — ninguém inventou os valores, foram fornecidos pelo dono do negócio. Registrado aqui só para rastreabilidade futura.'
    suggested_action: 'Se o gestor formalizar os limites em algum documento no futuro (política de crédito, manual interno), linkar esse documento em `faixa-prazo-medio.ts` e em `docs/architecture/tech-decisions.md` (fechando o R5 com uma fonte citável, não só o Change Log da story).'

  - id: 'TEST-001'
    severity: low
    finding: 'Mesma limitação estrutural recorrente deste projeto: sem Docker/WSL nesta máquina, não há teste de integração automatizado contra Postgres real dentro da suíte `npm test` — a validação contra dado real (soma das faixas = faturamento total) foi manual, via script ad-hoc, não faz parte do CI.'
    suggested_action: 'Nenhuma ação nova — mesma recomendação já registrada em gates anteriores (Stories 1.1–1.5, 2.1–2.3, 2.5, 3.1–3.3): endereçar quando um ambiente de CI com Postgres ficar disponível.'

waiver: { active: false }

evidence:
  validacoes_reexecutadas_pelo_qa:
    - command: 'npm run lint'
      result: 'PASS — sem erros'
    - command: 'npm run typecheck'
      result: 'PASS — sem erros'
    - command: 'npm test'
      result: 'PASS — 206 testes / 34 arquivos (13 novos desta story)'
    - command: 'npm run build'
      result: 'PASS — build de produção OK, /relatorios/vendas-por-faixa-prazo-medio dinâmica'
    - command: 'npm run dev + validação manual (curl + script de agregação independente contra Supabase)'
      result: 'PASS — rota responde 200; as 7 faixas exibidas somam R$ 10.394.644,52, idêntico ao faturamento total agregado fora da aplicação'
  acceptance_criteria:
    AC1: 'MET — total de vendas (faturamento) agrupado por faixa de Prazo Médio'
    AC2: 'MET — faixas fornecidas pelo gestor (P4 a P9 crescentes por dias; P1 acima de 109 dias)'
  bugs_encontrados_e_corrigidos:
    - description: 'Faixas definidas com min/max fixos (ex: P4 até 34, P5 de 35 a 47) deixavam um buraco para prazo médio fracionário entre 34 e 35 (ex: 34,5 não caía em faixa nenhuma) — prazoMedio é Decimal(8,2), não Int, desde a Story 1.4'
      fix: 'Lógica reescrita para tetos em cascata (primeira faixa cujo `max` comporta o valor), eliminando o buraco por construção. Teste de regressão adicionado (`faixaDoPrazoMedio(34.5)`)'
