    AC3: 'MET — mensagem genérica idêntica para e-mail inexistente e senha errada, com equalização de tempo de resposta testada'
    AC4: 'MET — sessão em banco (revogação imediata), cookie HttpOnly/SameSite=Lax/Secure(prod) verificado por teste, logout apaga a sessão'
    AC5: 'MET — prisma/seed.ts idempotente; README atualizado nesta revisão para documentar `npm run db:seed` e a rota /login (DOC-001 do rascunho desta revisão, fechado diretamente)'
