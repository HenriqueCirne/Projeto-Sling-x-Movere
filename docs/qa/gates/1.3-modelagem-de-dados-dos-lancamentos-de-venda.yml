status_reason: 'AC1, AC2 e AC3 verificadas por código e teste estrutural; a migração nunca foi aplicada contra um Postgres real (Docker/WSL ausentes, mesma limitação da 1.1/1.2). Decisão central da story (TD-04b: nenhum UNIQUE em id_lancamento/numero_documento) está correta e bem fundamentada em dado real. Nenhum problema bloqueante de código ou segurança.'
