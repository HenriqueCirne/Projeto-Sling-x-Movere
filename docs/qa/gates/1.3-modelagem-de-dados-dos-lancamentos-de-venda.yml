top_issues:
  - id: 'TEST-001'
    severity: medium
    finding: 'A migração `20260831190000_add_sales_entries` nunca foi aplicada contra um PostgreSQL real (Docker/WSL ausentes, reconfirmado nesta revisão — mesma limitação L1 das Stories 1.1 e 1.2). O caminho "aplica e reverte corretamente" e o smoke test de inserir/consultar um registro real (exigidos literalmente pela Task 5) não foram exercitados. Cobertura substituta: 9 testes estruturais que leem o SQL da migração e o schema do disco e afirmam as ACs deterministicamente — verifiquei que os regexes realmente capturam as colunas/índices esperados (reexecutei `prisma migrate diff` de forma independente e o SQL recomputado bate byte-a-byte com o commitado, exceto o cabeçalho de comentário).'
    suggested_action: 'Em qualquer máquina com Docker: `npm run db:up && npm run db:deploy`, inserir um registro de exemplo, consultar por cada campo indexado, e reverter a migração (`prisma migrate reset` ou down manual) para confirmar reversibilidade real.'

  - id: 'ARCH-001'
    severity: low
    finding: 'Os Dev Notes da story instruem genericamente "permitir nulos em campos cuja origem na API ainda não foi validada" (TD-03 é risco aberto). O @data-engineer fez uma exceção deliberada e bem documentada para 5 campos (`tipo`, `dataEmissao`, `valorTotal`, `quantidade`, `prazoMedio`), marcando-os `NOT NULL` por sustentarem os KPIs centrais somados sobre a coluna inteira. Concordo com a decisão — um `valorTotal` nulo quebraria silenciosamente a paridade do Ticket Médio com a planilha (TD-04 Achado 1, `SUM(U)/COUNTA(A)`) — mas é uma exceção a uma instrução genérica da story, não uma leitura literal dela, e vale registrar explicitamente para o @architect/@po acompanharem quando o spike da API (TD-03) acontecer: se a API não garantir esses 5 campos em 100% dos payloads, a Story 1.4 precisará rejeitar/logar a linha em vez de inserir com valor ausente.'
    suggested_action: 'Nenhuma ação agora. Revisitar quando o spike técnico da API Moveres (TD-03, recomendado como story própria) confirmar ou não a cobertura desses 5 campos.'

  - id: 'PERF-001'
    severity: low
    finding: '`@@index([dataEmissao])` e `@@index([dataEmissao, loja])` coexistem. Em Postgres, o índice composto já serve consultas que filtram só por `dataEmissao` (regra do prefixo mais à esquerda), tornando o índice individual parcialmente redundante — custo extra de escrita/armazenamento, não de correção. Ambos foram pedidos como subtasks explícitas e separadas da Task 4, então não é um erro de implementação.'
    suggested_action: 'Quando os padrões de consulta reais dos relatórios da Epic 2/3 forem conhecidos, avaliar remover o índice individual de `dataEmissao` se o composto cobrir os casos de uso.'

