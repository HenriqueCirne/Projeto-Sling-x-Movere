  acceptance_criteria:
    AC1: 'NOT MET (REQ-001, por decisão de escopo pré-existente) — agendamento automático depende de R3 (hospedagem), delegado a @devops'
    AC2: 'MET — busca por período + substituição idempotente por loja (`replaceSalesEntriesWindow`, TD-04b), testado e validado ao vivo'
    AC3: 'MET — log estruturado por loja no console, testado (`onLojaResult`)'
    AC4: 'MET — `npm run sync:moveres -- <de> <até>`, testado ao vivo'
    AC5: 'MET — falha isolada por loja (testado: uma loja com erro HTTP não impede as demais)'
  refactoring_performed:
    - file: 'packages/web/src/shared/sales-entries/replace-window.repository.ts (novo, extraído de sales-import)'
      change: 'replaceSalesEntriesWindow ganhou parâmetro opcional de escopo por loja'
      why: 'TD-04b define a janela idempotente como (Data de Emissão + Loja), não só data — a importação de planilha original só escopava por data (correto para ela, um dump de todas as lojas de uma vez), mas sincronizar uma loja via ERP sem esse escopo apagaria dados de outras lojas no mesmo período. Bug real, corrigido antes de causar dano (nenhuma versão sem o fix chegou a rodar contra produção)'
