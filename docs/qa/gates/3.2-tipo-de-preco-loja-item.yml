top_issues:
  - id: 'TEST-001'
    severity: medium
    finding: 'Mesma limitação recorrente: sem Docker/WSL, a query nunca rodou contra Postgres real.'
    suggested_action: 'Smoke test manual com Docker quando disponível.'
  - id: 'REQ-002'
    severity: low
    finding: 'A AC2 ("seletor permite escolher a dimensão de foco, replicando o comportamento da planilha atual") foi implementada como reordenação client-side dos mesmos dados, não como re-agregação por dimensão. É uma interpretação razoável e honesta (registrada nos Dev Notes como não-invenção), mas ainda é uma interpretação — vale confirmar com o gestor se bate com a expectativa real da planilha antes de considerar esta AC definitivamente fechada.'
    suggested_action: '@po confirmar com o gestor o comportamento esperado do seletor de foco na próxima revisão de produto.'
  - id: 'MNT-001'
    severity: low
    finding: '`TipoPrecoLojaItemTable` usa o índice do array como `key` de linha em vez de uma chave composta (tipoPreco+loja+item) — funciona corretamente (groupBy garante linhas únicas, sort não duplica), mas é menos robusto a mudanças futuras no componente.'
    suggested_action: 'Trocar para `key={`${row.tipoPreco}-${row.loja}-${row.item}`}` na próxima revisão do componente.'

